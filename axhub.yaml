version: axhub/v1
name: ax-war-samil-jcg
# 배포 시 전용 PostgreSQL 을 발급하고
# DATABASE_URL / DIRECT_DATABASE_URL 을 파드에 자동 주입해요.
database:
  engine: postgres
runtime:
  port: 3000
  health_path: /healthz
build:
  strategy: auto
  framework: nextjs
  dockerfile: Dockerfile
  deploy_method: docker
env:
  # AI 판단·기안서 읽기(Claude)에 필요해요. 값은 axhub env set 으로 따로 등록해요 (여기엔 이름만).
  required:
    - { name: ANTHROPIC_API_KEY, scope: runtime }
  optional:
    - name: ANTHROPIC_MODEL
      scope: runtime
    - name: ANTHROPIC_BASE_URL
      scope: runtime
    - name: APPHUB_API_URL
      scope: runtime
    - name: APPHUB_APP_SLUG
      scope: runtime
    - name: APPHUB_TENANT
      scope: runtime

# 배포 전 검사. 디자인 토큰 규칙을 어기면 여기서 걸려요.
ci:
  commands:
    - bash scripts/check-design.sh
